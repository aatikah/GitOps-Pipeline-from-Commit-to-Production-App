name: Build and deploy app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_NAME: ${{ vars.ECR_REPOSITORY }}
  TARGET_ENVIRONMENT: staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.path.join(os.getcwd(), 'app'))
          import app
          client = app.app.test_client()
          response = client.get('/')
          assert response.status_code == 200
          payload = response.get_json()
          assert payload['service'] == 'gitops-demo'
          response = client.get('/health')
          assert response.status_code == 200
          print('smoke tests passed')
          PY

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # - name: Show GitHub Identity Context
      #   run: |
      #     printf 'repository=%s\nref=%s\nevent=%s\nrepository_id=%s\nowner_id=%s\n' \
      #       "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_EVENT_NAME" \
      #       "$GITHUB_REPOSITORY_ID" "$GITHUB_REPOSITORY_OWNER_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest -f app/Dockerfile

      - name: Push image to ECR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Install PyYAML for GitOps update
        run: python -m pip install pyyaml

      - name: Update GitOps repo with new image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TARGET_ENVIRONMENT: ${{ env.TARGET_ENVIRONMENT }}
          GITOPS_REPO: https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ vars.GITOPS_REPOSITORY }}.git
        run: |
          bash scripts/update-gitops-image.sh
